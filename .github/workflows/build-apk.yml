name: Build and verify Chakalia Racing APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK exists, package and signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          test "$SIZE" -gt 20000
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | grep -E "package: name='com.chakalia.racing'|application-label:'Chakalia Racing'"
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Chakalia-Racing-Verified-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
